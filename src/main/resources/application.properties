spring.application.name=tienda-conveniencia-backend
server.port=8080

# Base de datos MySQL. Cada valor se puede reemplazar con una variable de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_conveniencia?serverTimezone=America/Santiago&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:tienda}
spring.datasource.password=${DB_PASSWORD:Tienda2026!}

# Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT. El secreto por defecto es solo para desarrollo: en producción se define JWT_SECRETO.
app.jwt.secreto=${JWT_SECRETO:OzKdndZfJwLwAlOTkj6figFWs+ppCG62kMqneozRXRExQqbuXhfBGcDkyd7Dugks}
app.jwt.minutos-acceso=15
app.jwt.dias-refresco=7
# true en producción con HTTPS
app.jwt.cookie-segura=false

# Orígenes del frontend autorizados (CORS)
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:4173}

# Carga categorías, productos, usuarios y boletas de ejemplo si la base está vacía
app.datos-iniciales=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
